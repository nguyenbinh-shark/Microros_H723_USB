name: Firmware CI

on:
  push:
    branches: [ main, opensource-cleanup ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './tools ./deploy'
        continue-on-error: true

      - name: Validate Python scripts
        run: |
          python3 -m py_compile teleop/teleop_key.py

      - name: Verify line endings and encodings
        run: |
          echo "[INFO] Checking tracked files encoding..."
          python3 -c "
          import glob, os, sys
          failed = False
          for p in glob.glob('**/*', recursive=True):
              if os.path.isfile(p) and (p.endswith('.md') or p.endswith('.sh') or p.endswith('.py') or p.endswith('.c') or p.endswith('.h')):
                  try:
                      with open(p, 'r', encoding='utf-8') as f:
                          f.read()
                  except UnicodeDecodeError as e:
                      print(f'Encoding error in {p}: {e}')
                      failed = True
          if failed:
              sys.exit(1)
          print('All text files are valid UTF-8.')
          "

  build:
    name: Build STM32 Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '12.3.Rel1'

      - name: Restore micro-ROS Static Library Cache
        id: cache-microros
        uses: actions/cache@v4
        with:
          path: micro_ros_stm32cubemx_utils/microros_static_library/libmicroros
          key: microros-jazzy-stm32h723-v1.0.0-3c7bb1a21d20712d59f175ecae2c0d10d36e7d583eb020df97b67aa585f4ab6b

      - name: Fetch micro-ROS Static Library
        if: steps.cache-microros.outputs.cache-hit != 'true'
        run: |
          chmod +x tools/*.sh
          ./tools/fetch_libmicroros.sh

      - name: Compile Firmware
        run: |
          make clean
          make -j$(nproc)

      - name: Output Binary Size
        run: |
          arm-none-eabi-size build/microros_H7.elf

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stm32h7-firmware
          path: |
            build/microros_H7.elf
            build/microros_H7.bin
            build/microros_H7.hex

