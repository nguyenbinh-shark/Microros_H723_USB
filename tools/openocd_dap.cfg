# OpenOCD config for the STM32H723 through a CMSIS-DAP probe (e.g. wireless DAPLink).
# Used by tools/flash_dap.sh and by Cortex-Debug (.vscode/launch.json).

source [find interface/cmsis-dap.cfg]
transport select swd

# Required by ST's stm32h7x.cfg (STM32CubeIDE OpenOCD), ignored by upstream OpenOCD.
set AP_NUM 0
# Follow the GDB port chosen by the caller (Cortex-Debug picks its own; default 3333).
set GDB_PORT [gdb_port]
# Reset with SYSRESETREQ (whole chip) instead of VECTRESET (core only).
set CORE_RESET 0
source [find target/stm32h7x.cfg]

# Reset over SWD only, so NRST does not need to be wired
# (the wireless DAPLink RST pin doubles as RTS when esp_down=enable).
reset_config none

# GDB hooks from ST's gdb_helper.tcl (upstream OpenOCD never calls them):
# halt only when the first debugger attaches, so Cortex-Debug's extra Live Watch connection
# does not stop the robot, and resume the core before OpenOCD exits on the last detach,
# otherwise the chip stays frozen after the debug session ends.
proc first_gdb_attach_hook {} { halt 1000 }
proc last_gdb_detach_hook {} { catch {resume}; shutdown }
